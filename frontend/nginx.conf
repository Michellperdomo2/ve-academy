# Sirve la SPA y reenvía /api al contenedor del backend (misma origen: sin CORS en producción).
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  server_tokens off;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
  }

  # Archivos con hash: caché larga. index.html: sin caché.
  # Se usa "expires" (no add_header) para no anular los encabezados de seguridad del bloque server.
  location ~* \.(?:js|css|woff2?|svg|png|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
